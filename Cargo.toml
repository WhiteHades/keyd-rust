[package]
name = "keyd-rust"
version = "2.6.0"
edition = "2024"
rust-version = "1.98"
license = "MIT"
description = "keyd-rust keyboard remapping daemon, a pure Rust port of keyd"
publish = false
default-run = "keyd-rust"

[lib]
name = "keyd_rust"
path = "src/lib.rs"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true

[[example]]
name = "keyboard-e2e"
path = "t/keyboard-e2e.rs"

[[bin]]
name = "keyd-rust-generate-xcompose"
path = "src/bin/keyd-rust-generate-xcompose.rs"

[[bin]]
name = "keyd-rust-application-mapper"
path = "src/bin/keyd-rust-application-mapper.rs"

[[bin]]
name = "keyd-rust-dump-xkb-config"
path = "src/bin/keyd-rust-dump-xkb-config.rs"

[[example]]
name = "double-tap-e2e"
path = "t/double-tap-e2e.rs"
